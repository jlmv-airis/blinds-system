<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blindsystem MVP</title>
<style>
  :root {
    --primary: #2d5fa0;
    --primary-dark: #1e4276;
    --danger: #c0392b;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e1e4e8;
    --text: #22292f;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--primary-dark);
    color: white;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .user-info { font-size: 13px; display: flex; align-items: center; gap: 12px; }
  header button {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { background: rgba(255,255,255,0.25); }

  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-card {
    background: var(--card);
    padding: 36px;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    width: 320px;
  }
  .login-card h2 { margin-top: 0; font-size: 20px; }
  .login-card p.hint { font-size: 12px; color: var(--muted); margin-top: -8px; }

  label { display: block; font-size: 13px; margin: 14px 0 6px; color: var(--muted); }
  input, textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--primary); }

  button.primary {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  button.primary:hover { background: var(--primary-dark); }
  button.primary:disabled { background: #a9b7c9; cursor: not-allowed; }

  button.danger {
    background: var(--danger);
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
  }
  button.danger:disabled { background: #e6b3ac; cursor: not-allowed; }

  button.secondary {
    background: #eef1f5;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
  }

  .error-msg {
    background: #fdecea;
    color: var(--danger);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 14px;
  }
  .success-msg {
    background: #eafaf1;
    color: #1e7e34;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin: 10px 0;
  }

  main { max-width: 960px; margin: 24px auto; padding: 0 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button {
    background: none;
    border: none;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--muted);
  }
  .tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

  .panel { background: var(--card); border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 20px; }
  .panel h3 { margin-top: 0; font-size: 15px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .form-row > div { flex: 1; min-width: 140px; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr.inactive td { color: var(--muted); text-decoration: line-through; }
  td.actions { display: flex; gap: 6px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.admin { background: #e8f0fe; color: var(--primary-dark); }
  .badge.user { background: #f1f1f1; color: var(--muted); }
  .empty-state { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h2>Blindsystem MVP</h2>
    <p class="hint">Login funcional del núcleo nuevo (no el sistema legacy)</p>
    <form id="login-form">
      <label>Correo electrónico</label>
      <input type="email" id="login-email" required autocomplete="username" value="admin@blinds-system.com">
      <label>Contraseña</label>
      <input type="password" id="login-password" required autocomplete="current-password" value="ChangeMe123!">
      <div style="margin-top:18px">
        <button type="submit" class="primary" style="width:100%">Iniciar sesión</button>
      </div>
    </form>
    <div id="login-error"></div>
  </div>
</div>

<div id="app-screen" style="display:none">
  <header>
    <h1>Blindsystem MVP</h1>
    <div class="user-info">
      <span id="user-name"></span>
      <span id="user-role-badge"></span>
      <button id="logout-btn">Cerrar sesión</button>
    </div>
  </header>
  <main>
    <div class="tabs">
      <button class="tab-btn active" data-tab="clients">Clientes</button>
      <button class="tab-btn" data-tab="products">Productos</button>
    </div>

    <div id="tab-clients" class="tab-panel">
      <div class="panel">
        <h3>Nuevo cliente</h3>
        <form id="client-form">
          <div class="form-row">
            <div><label>Nombre *</label><input type="text" id="client-name" required></div>
            <div><label>Email</label><input type="email" id="client-email"></div>
            <div><label>Teléfono</label><input type="text" id="client-phone"></div>
            <div style="flex:0"><button type="submit" class="primary">Agregar</button></div>
          </div>
        </form>
        <div id="client-form-msg"></div>
      </div>
      <div class="panel">
        <h3>Listado de clientes</h3>
        <table>
          <thead><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Acciones</th></tr></thead>
          <tbody id="clients-tbody"></tbody>
        </table>
        <div id="clients-empty" class="empty-state" style="display:none">Sin clientes todavía.</div>
      </div>
    </div>

    <div id="tab-products" class="tab-panel" style="display:none">
      <div class="panel">
        <h3>Nuevo producto</h3>
        <form id="product-form">
          <div class="form-row">
            <div><label>SKU *</label><input type="text" id="product-sku" required></div>
            <div><label>Nombre *</label><input type="text" id="product-name" required></div>
            <div><label>Precio *</label><input type="number" step="0.01" min="0" id="product-price" required></div>
            <div><label>Stock</label><input type="number" min="0" id="product-stock" value="0"></div>
            <div style="flex:0"><button type="submit" class="primary">Agregar</button></div>
          </div>
        </form>
        <div id="product-form-msg"></div>
      </div>
      <div class="panel">
        <h3>Listado de productos</h3>
        <table>
          <thead><tr><th>SKU</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
          <tbody id="products-tbody"></tbody>
        </table>
        <div id="products-empty" class="empty-state" style="display:none">Sin productos todavía.</div>
      </div>
    </div>
  </main>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('mvp_token');
let currentUser = null;

function authHeaders(extra = {}) {
  return Object.assign({ 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }, extra);
}

async function api(method, path, body) {
  const opts = { method, headers: authHeaders(body ? { 'Content-Type': 'application/json' } : {}) };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  return { status: res.status, data };
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('user-name').textContent = currentUser.name;
  const badge = document.getElementById('user-role-badge');
  badge.textContent = currentUser.role;
  badge.className = 'badge ' + currentUser.role;
  loadClients();
  loadProducts();
}

function showLogin(message) {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
  localStorage.removeItem('mvp_token');
  token = null;
  if (message) {
    document.getElementById('login-error').innerHTML = '<div class="error-msg">' + message + '</div>';
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  document.getElementById('login-error').innerHTML = '';
  const { status, data } = await api('POST', '/login', { email, password });
  if (status === 200 && data.success) {
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('mvp_token', token);
    showApp();
  } else {
    document.getElementById('login-error').innerHTML = '<div class="error-msg">' + (data?.message || 'Error al iniciar sesión') + '</div>';
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await api('POST', '/logout');
  showLogin();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
    document.getElementById('tab-' + btn.dataset.tab).style.display = 'block';
  });
});

// --- Clientes ---
async function loadClients() {
  const { status, data } = await api('GET', '/clients');
  if (status === 401) return showLogin('Sesión expirada, inicia sesión de nuevo.');
  const tbody = document.getElementById('clients-tbody');
  tbody.innerHTML = '';
  const clients = data?.data || [];
  document.getElementById('clients-empty').style.display = clients.length ? 'none' : 'block';
  clients.forEach(c => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(c.name)}</td>
      <td>${escapeHtml(c.email || '—')}</td>
      <td>${escapeHtml(c.phone || '—')}</td>
      <td class="actions">
        <button class="secondary" onclick="editClient(${c.id}, '${escapeAttr(c.phone||'')}')">Editar teléfono</button>
        <button class="danger" ${currentUser.role !== 'admin' ? 'disabled title="Solo admin puede eliminar"' : ''} onclick="deleteClient(${c.id})">Eliminar</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById('client-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('client-name').value;
  const email = document.getElementById('client-email').value;
  const phone = document.getElementById('client-phone').value;
  const { status, data } = await api('POST', '/clients', { name, email, phone });
  const msg = document.getElementById('client-form-msg');
  if (status === 201) {
    msg.innerHTML = '<div class="success-msg">Cliente creado</div>';
    e.target.reset();
    loadClients();
  } else {
    const errs = data?.errors ? Object.values(data.errors).flat().join(' ') : (data?.message || 'Error');
    msg.innerHTML = '<div class="error-msg">' + errs + '</div>';
  }
  setTimeout(() => msg.innerHTML = '', 4000);
});

async function editClient(id, currentPhone) {
  const phone = prompt('Nuevo teléfono:', currentPhone);
  if (phone === null) return;
  await api('PUT', '/clients/' + id, { phone });
  loadClients();
}

async function deleteClient(id) {
  if (!confirm('¿Eliminar este cliente?')) return;
  const { status, data } = await api('DELETE', '/clients/' + id);
  if (status === 403) alert(data.message);
  loadClients();
}

// --- Productos ---
async function loadProducts() {
  const { status, data } = await api('GET', '/products');
  if (status === 401) return showLogin('Sesión expirada, inicia sesión de nuevo.');
  const tbody = document.getElementById('products-tbody');
  tbody.innerHTML = '';
  const products = data?.data || [];
  document.getElementById('products-empty').style.display = products.length ? 'none' : 'block';
  products.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(p.sku)}</td>
      <td>${escapeHtml(p.name)}</td>
      <td>$${parseFloat(p.price).toFixed(2)}</td>
      <td>${p.stock}</td>
      <td class="actions">
        <button class="secondary" onclick="editProductStock(${p.id}, ${p.stock})">Editar stock</button>
        <button class="danger" ${currentUser.role !== 'admin' ? 'disabled title="Solo admin puede eliminar"' : ''} onclick="deleteProduct(${p.id})">Eliminar</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById('product-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const sku = document.getElementById('product-sku').value;
  const name = document.getElementById('product-name').value;
  const price = document.getElementById('product-price').value;
  const stock = document.getElementById('product-stock').value;
  const { status, data } = await api('POST', '/products', { sku, name, price, stock });
  const msg = document.getElementById('product-form-msg');
  if (status === 201) {
    msg.innerHTML = '<div class="success-msg">Producto creado</div>';
    e.target.reset();
    document.getElementById('product-stock').value = 0;
    loadProducts();
  } else {
    const errs = data?.errors ? Object.values(data.errors).flat().join(' ') : (data?.message || 'Error');
    msg.innerHTML = '<div class="error-msg">' + errs + '</div>';
  }
  setTimeout(() => msg.innerHTML = '', 4000);
});

async function editProductStock(id, currentStock) {
  const stock = prompt('Nuevo stock:', currentStock);
  if (stock === null) return;
  await api('PUT', '/products/' + id, { stock: parseInt(stock, 10) });
  loadProducts();
}

async function deleteProduct(id) {
  if (!confirm('¿Eliminar este producto?')) return;
  const { status, data } = await api('DELETE', '/products/' + id);
  if (status === 403) alert(data.message);
  loadProducts();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return String(str).replace(/'/g, "\\'");
}

// --- Init ---
(async function init() {
  if (token) {
    const { status, data } = await api('GET', '/me');
    if (status === 200 && data.success) {
      currentUser = data.user;
      showApp();
    } else {
      showLogin();
    }
  }
})();
</script>

</body>
</html>
