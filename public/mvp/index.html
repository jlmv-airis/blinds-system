<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blindsystem MVP — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="brand">Blindsystem</div>
      <div class="subtitle">Panel de administración (MVP)</div>

      <div id="login-alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Usuario o correo electrónico</label>
          <div class="field-icon">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/></svg>
            <input type="email" id="email" name="email" required autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="field-icon">
            <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
        </div>
        <button type="submit" id="login-btn" class="btn-primary">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
