<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blindsystem MVP — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-full">Blindsystem</span>
        <span class="brand-mark">B</span>
        <button type="button" id="sidebar-toggle" class="sidebar-toggle" title="Colapsar menú">
          <svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <nav>
        <a href="#" data-view="home" data-title="Dashboard" class="nav-link active">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span class="label">Dashboard</span>
        </a>
        <a href="#" data-view="clients" data-title="Clientes" class="nav-link">
          <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="label">Clientes</span>
        </a>
        <a href="#" data-view="products" data-title="Productos" class="nav-link">
          <svg class="icon" viewBox="0 0 24 24"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
          <span class="label">Productos</span>
        </a>
        <a href="#" data-view="orders" data-title="Órdenes" class="nav-link">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="label">Órdenes</span>
        </a>
        <div class="nav-section-label"><span class="label">Próximamente</span></div>
        <span class="nav-link nav-link--disabled" title="Módulo aún no construido">
          <svg class="icon" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8Z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          <span class="label">Almacén</span>
        </span>
        <span class="nav-link nav-link--disabled" title="Módulo aún no construido">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span class="label">BI</span>
        </span>
      </nav>
    </aside>

    <div class="content-col">
      <header class="app-bar">
        <button type="button" id="sidebar-toggle-mobile" class="icon-btn app-bar-menu-btn" title="Menú">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <nav class="breadcrumb" id="breadcrumb">
          <span>Inicio</span>
        </nav>
        <div class="app-bar-spacer"></div>
        <div class="app-bar-user">
          <div class="app-bar-user-info">
            <span class="user-name" id="user-name">—</span>
            <span class="user-role" id="user-role">—</span>
          </div>
          <button type="button" id="logout-link" class="icon-btn app-bar-logout" title="Cerrar sesión">
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </header>
      <main class="main-content">
        <section id="view-home" class="view"></section>
        <section id="view-clients" class="view" hidden></section>
        <section id="view-products" class="view" hidden></section>
        <section id="view-orders" class="view" hidden></section>
      </main>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal-box" id="modal-box"></div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
